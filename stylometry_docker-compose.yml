services:
  postgres:
    image: postgres:16
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-stylometry_user}
      POSTGRES_PASSWORD: ${DB_PASS:-stylometry_password}
      POSTGRES_DB: ${DB_NAME:-stylometry_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stylometry_user} -d ${DB_NAME:-stylometry_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      - postgres

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootpassword}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-stylometry}
      MINIO_BROWSER: "on"
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-root} ${MINIO_ROOT_PASSWORD:-rootpassword}
      && mc mb --ignore-existing local/${MINIO_BUCKET:-stylometry}
      && mc anonymous set download local/${MINIO_BUCKET:-stylometry}"

  redis:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: stylometry_Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_INTERNAL_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-stylometry}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootpassword}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-stylometry_user}
      DB_PASS: ${DB_PASS:-stylometry_password}
      DB_NAME: ${DB_NAME:-stylometry_db}
      ENABLE_FRONTEND: ${ENABLE_FRONTEND:-false}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
  redis-data:
