services:
  postgres:
    image: postgres:16
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-stylometry_user}
      POSTGRES_PASSWORD: ${DB_PASS:-stylometry_password}
      POSTGRES_DB: ${DB_NAME:-stylometry_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootpassword}
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-root} ${MINIO_ROOT_PASSWORD:-rootpassword}; do sleep 1; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-stylometry};
      mc anonymous set download local/${MINIO_BUCKET:-stylometry};
      "

  app:
    build:
      context: .
      dockerfile: stylometry_Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-stylometry}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-stylometry_user}
      DB_PASS: ${DB_PASS:-stylometry_password}
      DB_NAME: ${DB_NAME:-stylometry_db}
    depends_on:
      - postgres
      - minio-init

volumes:
  minio-data:
  postgres-data:
